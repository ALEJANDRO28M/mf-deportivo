<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1F4B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="MF Deportivo · Entrenamientos personalizados de fútbol. Evaluación y avances de jugadores, seguimiento de sesiones e informes para las familias.">
<title>MF Deportivo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 240'%3E%3Cpath d='M100 6 L190 32 V128 C190 190 142 224 100 236 C58 224 10 190 10 128 V32 Z' fill='%23D9A93C'/%3E%3Cpath d='M100 16 L180 39 V128 C180 182 138 212 100 224 C62 212 20 182 20 128 V39 Z' fill='%230F1F4B'/%3E%3Ctext x='100' y='150' text-anchor='middle' font-family='Arial Narrow,Arial' font-weight='900' font-style='italic' font-size='90' fill='%23D9A93C'%3EMF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,400&display=swap">
<style>
:root{
  --ground:#F3F4F8; --surface:#FFFFFF; --surface-2:#F7F8FC; --surface-3:#EEF0F7;
  --ink:#0F1A38; --muted:#56618A; --faint:#8A93B3;
  --line:#DFE3EF; --line-strong:#C4CADF;
  --navy:#0F1F4B; --navy-2:#1A3272; --navy-3:#24408C; --navy-ink:#FFFFFF;
  --gold:#D9A93C; --gold-2:#F1C660; --gold-ink:#2A1E05; --gold-soft:#FBF1D6; --gold-line:#E9CF8A;
  --up:#22945A; --up-soft:#E2F5EA; --down:#D3503B; --down-soft:#FBE6E2; --flat:#8A93B3; --warn:#D98A1F; --wa:#25D366; --wa-ink:#063B1E;
  --s1:#D3503B; --s2:#E0813A; --s3:#D9A93C; --s4:#5FAE55; --s5:#22945A;
  --hi:#1A3272;
  --shadow:0 1px 2px rgba(15,26,56,.06), 0 10px 28px -18px rgba(15,26,56,.35);
  --shadow-lift:0 2px 4px rgba(15,26,56,.08), 0 18px 40px -20px rgba(15,26,56,.45);
  --r:14px; --r-sm:9px;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0A1226; --surface:#121C38; --surface-2:#182448; --surface-3:#1E2C57;
    --ink:#EEF1FA; --muted:#A5AECB; --faint:#7C86A8;
    --line:#243158; --line-strong:#33427A;
    --navy:#1C2F66; --navy-2:#27408A; --navy-3:#3352A8; --navy-ink:#FFFFFF;
    --gold:#E4B54B; --gold-2:#F5D078; --gold-ink:#2A1E05; --gold-soft:#3A2F12; --gold-line:#6E5820;
    --up:#4CC783; --up-soft:#173A29; --down:#F07A64; --down-soft:#3F1F1B; --flat:#7C86A8; --warn:#F0A741;
    --s1:#F07A64; --s2:#F09A55; --s3:#E4B54B; --s4:#7BC96F; --s5:#4CC783;
    --hi:#F5D078;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px -18px rgba(0,0,0,.8);
    --shadow-lift:0 2px 4px rgba(0,0,0,.4), 0 20px 44px -20px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0A1226; --surface:#121C38; --surface-2:#182448; --surface-3:#1E2C57;
  --ink:#EEF1FA; --muted:#A5AECB; --faint:#7C86A8;
  --line:#243158; --line-strong:#33427A;
  --navy:#1C2F66; --navy-2:#27408A; --navy-3:#3352A8; --navy-ink:#FFFFFF;
  --gold:#E4B54B; --gold-2:#F5D078; --gold-ink:#2A1E05; --gold-soft:#3A2F12; --gold-line:#6E5820;
  --up:#4CC783; --up-soft:#173A29; --down:#F07A64; --down-soft:#3F1F1B; --flat:#7C86A8; --warn:#F0A741;
  --s1:#F07A64; --s2:#F09A55; --s3:#E4B54B; --s4:#7BC96F; --s5:#4CC783;
  --hi:#F5D078;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px -18px rgba(0,0,0,.8);
  --shadow-lift:0 2px 4px rgba(0,0,0,.4), 0 20px 44px -20px rgba(0,0,0,.9);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--display); margin:0; text-wrap:balance; letter-spacing:.005em; line-height:1.05}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--hi)}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:4px}

/* ---------- shell ---------- */
.topbar{
  position:sticky; top:0; z-index:30;
  background:var(--navy);
  background-image:linear-gradient(90deg, var(--navy) 0%, var(--navy-2) 60%, var(--navy-3) 100%);
  color:var(--navy-ink);
  box-shadow:0 2px 0 var(--gold), 0 8px 24px -14px rgba(0,0,0,.5);
  padding-top:env(safe-area-inset-top,0px);
}
.topbar-in{
  max-width:1120px; margin:0 auto; padding:9px 16px;
  display:flex; align-items:center; gap:6px;
}
.brand{display:flex; align-items:center; gap:10px; margin-right:auto; min-width:0; cursor:pointer; background:none; border:0; padding:0; color:inherit; text-align:left}
.brand .logo{width:40px; height:48px; flex:none; filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.logo img, .logo svg{width:100%; height:100%; object-fit:contain; display:block}
.brand-t{display:flex; flex-direction:column; line-height:1; min-width:0}
.brand-t b{font-family:var(--display); font-weight:800; font-size:21px; letter-spacing:.01em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand-t span{font-family:var(--display); font-size:10.5px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-2); margin-top:3px}
.topbar .btn.ghost{color:rgba(255,255,255,.85)}
.topbar .btn.ghost:hover{background:rgba(255,255,255,.12); color:#fff}
.topbar .btn.ghost[aria-current="page"]{background:rgba(255,255,255,.16); color:#fff}
main{max-width:1120px; margin:0 auto; padding-block:20px 72px; padding-inline:16px}
@media (max-width:560px){ .topbar .btn.ghost .lbl{display:none} .topbar .btn.ghost{padding-inline:9px} }

/* ---------- controls ---------- */
.btn{
  display:inline-flex; align-items:center; gap:7px; cursor:pointer;
  background:var(--surface); color:var(--ink);
  border:1px solid var(--line-strong); border-radius:10px;
  padding:8px 14px; font-family:var(--display); font-weight:700; font-size:15px; letter-spacing:.02em;
  transition:background .12s, border-color .12s, transform .08s;
  text-decoration:none; white-space:nowrap;
}
.btn:hover{background:var(--surface-2); border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--gold); color:var(--gold-ink); border-color:var(--gold)}
.btn.primary:hover{background:var(--gold-2); border-color:var(--gold-2)}
.btn.navy{background:var(--navy-2); color:var(--navy-ink); border-color:var(--navy-2)}
.btn.navy:hover{background:var(--navy-3); border-color:var(--navy-3)}
.btn.wa{background:var(--wa); color:var(--wa-ink); border-color:var(--wa)}
.btn.wa:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--muted); padding-inline:10px}
.btn.ghost:hover{background:var(--surface-3); color:var(--ink)}
.btn.danger{color:var(--down); border-color:var(--line-strong)}
.btn.danger:hover{background:var(--down-soft); border-color:var(--down)}
.btn.sm{padding:5px 10px; font-size:13.5px; border-radius:8px}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],input[type=search],input[type=url],input[type=password],select,textarea{
  width:100%; background:var(--surface); border:1px solid var(--line-strong);
  border-radius:9px; padding:9px 11px; font-size:15px; color:var(--ink);
}
input:focus,select:focus,textarea:focus{border-color:var(--gold); box-shadow:0 0 0 3px color-mix(in srgb, var(--gold) 25%, transparent); outline:none}
textarea{resize:vertical; min-height:64px; line-height:1.45}
label.f{display:block}
label.f>span{
  display:block; font-family:var(--display); font-size:12px; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-bottom:4px;
}
label.f .hint{display:block; font-size:12px; color:var(--faint); margin-top:3px}
.sect-title{
  font-family:var(--display); font-size:12.5px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--faint); margin:0 0 10px; display:flex; align-items:center; gap:8px;
}
.sect-title::after{content:''; flex:1; height:1px; background:var(--line)}
.legend{font-size:12.5px; color:var(--faint); margin:10px 0 0}
.two{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:520px){ .two{grid-template-columns:1fr} }
.filebtn{position:relative; overflow:hidden}
.filebtn input{position:absolute; inset:0; opacity:0; cursor:pointer}

/* ---------- hero (plantel) ---------- */
.hero{
  position:relative; overflow:hidden; border-radius:var(--r);
  background:var(--navy); background-image:
    radial-gradient(ellipse at 100% 0%, color-mix(in srgb, var(--navy-3) 70%, transparent) 0%, transparent 55%),
    linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
  color:var(--navy-ink); padding:22px 22px 20px; margin-bottom:18px; box-shadow:var(--shadow-lift);
}
.hero::before{
  content:''; position:absolute; inset:0; pointer-events:none; opacity:.14;
  background:
    radial-gradient(circle at 100% 50%, transparent 118px, #fff 118px, #fff 120px, transparent 121px),
    linear-gradient(#fff,#fff) right 0 top 0 / 2px 100% no-repeat;
}
.hero-in{position:relative; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.hero .logo{width:76px; height:92px; flex:none; filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.hero h1{font-size:34px; font-weight:800; text-transform:uppercase; letter-spacing:.01em}
.hero h1 em{font-style:normal; color:var(--gold-2)}
.hero .lema{color:rgba(255,255,255,.78); font-size:14px; margin-top:2px}
.hero .cta{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}
.hero .btn.ghost{color:rgba(255,255,255,.9); border-color:rgba(255,255,255,.25)}
.hero .btn.ghost:hover{background:rgba(255,255,255,.12)}
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:18px; position:relative}
.tile{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); border-radius:11px; padding:10px 12px; min-width:0}
.tile .k{font-family:var(--display); font-size:11.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.7)}
.tile .v{font-family:var(--display); font-size:30px; font-weight:800; line-height:1; margin-top:4px; font-variant-numeric:tabular-nums; color:#fff}
.tile .v small{font-size:14px; font-weight:600; color:rgba(255,255,255,.65); margin-left:3px}
.tile .v.gold{color:var(--gold-2)}
.tile .sub{font-size:12px; color:rgba(255,255,255,.7); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* ---------- roster ---------- */
.page-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.page-head h2{font-size:24px; font-weight:800; text-transform:uppercase}
.page-head .sub{color:var(--muted); font-size:14px}
.page-head .search{margin-left:auto; max-width:260px; flex:1 1 180px}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px}
.pcard-r{
  position:relative; display:grid; grid-template-columns:52px minmax(0,1fr); gap:12px; align-items:center;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:14px; cursor:pointer; text-align:left; width:100%; color:inherit;
  transition:transform .12s, box-shadow .12s, border-color .12s;
}
.pcard-r:hover{transform:translateY(-2px); box-shadow:var(--shadow-lift); border-color:var(--gold-line)}
.avatar{
  width:52px; height:52px; border-radius:50%; display:grid; place-items:center; flex:none; overflow:hidden;
  background:var(--navy-2); color:#fff; font-family:var(--display); font-weight:800; font-size:20px; letter-spacing:.02em;
  box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--gold);
}
.avatar img{width:100%; height:100%; object-fit:cover; display:block}
.avatar.lg{width:72px; height:72px; font-size:28px}
.avatar.xl{width:120px; height:120px; font-size:44px; box-shadow:0 0 0 3px var(--surface), 0 0 0 7px var(--gold)}
.pcard-r .nm,.pcard-r .meta{display:block}
.pcard-r .nm{font-family:var(--display); font-weight:700; font-size:20px; line-height:1.1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pcard-r .meta{font-size:12.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px}
.pcard-r .score{grid-column:1/-1; display:flex; align-items:center; gap:9px; margin-top:2px}
.score-num{font-family:var(--display); font-weight:800; font-size:20px; font-variant-numeric:tabular-nums; min-width:30px; line-height:1}
.score-num.none{color:var(--faint); font-weight:600; font-size:14px}
.bar{height:7px; border-radius:4px; background:var(--surface-3); flex:1; overflow:hidden; min-width:40px}
.bar i{display:block; height:100%; background:linear-gradient(90deg, var(--gold), var(--gold-2)); border-radius:4px; transition:width .3s}
.chip{
  display:inline-flex; align-items:center; gap:4px; font-family:var(--display);
  font-weight:700; font-size:12.5px; padding:2px 8px; border-radius:99px; letter-spacing:.02em;
  border:1px solid var(--line-strong); color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap;
}
.chip.up{color:var(--up); border-color:transparent; background:var(--up-soft)}
.chip.down{color:var(--down); border-color:transparent; background:var(--down-soft)}
.pcard-r .quick{position:absolute; top:10px; right:10px; display:flex; gap:4px}
.iconbtn{
  width:30px; height:30px; border-radius:8px; display:grid; place-items:center; border:1px solid transparent;
  background:transparent; color:var(--faint); cursor:pointer; padding:0;
}
.iconbtn:hover{background:var(--surface-3); color:var(--ink)}
.iconbtn.wa{color:var(--wa)}
.iconbtn.wa:hover{background:color-mix(in srgb, var(--wa) 15%, transparent)}
.iconbtn svg{width:17px;height:17px}

/* ---------- player ---------- */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:16px; margin-bottom:14px;
}
.phead{
  background:var(--navy); background-image:linear-gradient(120deg, var(--navy) 0%, var(--navy-2) 70%, var(--navy-3) 100%);
  color:#fff; border-radius:var(--r); padding:16px; margin-bottom:14px; box-shadow:var(--shadow-lift);
  display:flex; gap:14px; align-items:center; flex-wrap:wrap;
}
.phead .avatar{box-shadow:0 0 0 3px var(--gold)}
.phead h2{font-size:30px; font-weight:800; text-transform:uppercase; line-height:1}
.phead .meta{font-size:13.5px; color:rgba(255,255,255,.78); margin-top:3px; display:flex; gap:6px 14px; flex-wrap:wrap}
.phead .btn.ghost{color:rgba(255,255,255,.9); border-color:rgba(255,255,255,.28)}
.phead .btn.ghost:hover{background:rgba(255,255,255,.12)}
.phead .right{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}
.tabs{display:flex; gap:4px; background:var(--surface-3); padding:4px; border-radius:11px; margin-bottom:14px; width:fit-content; max-width:100%; overflow:auto}
.tab{
  border:0; background:transparent; cursor:pointer; padding:7px 14px; border-radius:8px; color:var(--muted);
  font-family:var(--display); font-weight:700; font-size:15px; letter-spacing:.03em; text-transform:uppercase; white-space:nowrap;
}
.tab[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.tab .cnt{display:inline-block; min-width:18px; padding:0 5px; border-radius:99px; background:var(--gold); color:var(--gold-ink); font-size:12px; margin-left:6px; text-align:center}
.periods{display:flex; gap:7px; flex-wrap:wrap; align-items:center}
.ptab{
  cursor:pointer; background:var(--surface); border:1px solid var(--line-strong);
  border-radius:10px; padding:6px 12px; font-family:var(--display); font-weight:700; font-size:15px;
  display:flex; flex-direction:column; align-items:flex-start; line-height:1.15;
}
.ptab small{font-weight:600; font-size:12px; color:var(--faint); letter-spacing:.04em}
.ptab[aria-selected="true"]{background:var(--navy-2); color:#fff; border-color:var(--navy-2)}
.ptab[aria-selected="true"] small{color:var(--gold-2)}

.areas{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px}
.areabox{border:1px solid var(--line); border-radius:11px; padding:10px 12px; background:var(--surface-2)}
.areabox .an{font-family:var(--display); font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.areabox .av{display:flex; align-items:baseline; gap:6px; margin:3px 0 7px}
.areabox .av b{font-family:var(--display); font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1}
.areabox .av span{font-size:12px; color:var(--faint)}
.bignum{font-family:var(--display); font-size:44px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1; color:var(--hi)}

/* aspect rows */
.agroup{border:1px solid var(--line); border-radius:11px; overflow:hidden; margin-bottom:10px; background:var(--surface)}
.agroup>summary{
  cursor:pointer; list-style:none; padding:11px 13px; background:var(--surface-2);
  display:flex; align-items:center; gap:10px;
  font-family:var(--display); font-size:15px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
}
.agroup>summary::-webkit-details-marker{display:none}
.agroup>summary .arrow{color:var(--faint); transition:transform .15s; font-size:12px}
.agroup[open]>summary .arrow{transform:rotate(90deg)}
.agroup>summary .gv{margin-left:auto; font-variant-numeric:tabular-nums; letter-spacing:0; font-size:17px; color:var(--hi)}
.agroup>summary .done{font-size:12px; color:var(--faint); letter-spacing:0; font-weight:600; text-transform:none; font-family:var(--body)}
.asp{
  display:grid; grid-template-columns:minmax(0,1fr) auto 40px 30px; align-items:center; gap:8px;
  padding:7px 12px; border-top:1px solid var(--line);
}
.asp-name{font-size:14.5px}
.scale{display:flex; gap:3px}
.sc{
  width:31px; height:31px; border-radius:8px; cursor:pointer;
  border:1px solid var(--line-strong); background:var(--surface);
  font-family:var(--display); font-weight:700; font-size:15px; font-variant-numeric:tabular-nums;
  display:grid; place-items:center; padding:0; transition:transform .08s;
}
.sc:hover{border-color:var(--gold); color:var(--gold-ink); background:var(--gold-soft)}
.sc:active{transform:scale(.93)}
.sc[aria-pressed="true"]{color:#fff; border-color:transparent}
.sc[aria-pressed="true"][data-v="1"]{background:var(--s1)}
.sc[aria-pressed="true"][data-v="2"]{background:var(--s2)}
.sc[aria-pressed="true"][data-v="3"]{background:var(--s3); color:var(--gold-ink)}
.sc[aria-pressed="true"][data-v="4"]{background:var(--s4)}
.sc[aria-pressed="true"][data-v="5"]{background:var(--s5)}
.sc.clear{color:var(--faint); font-weight:500}
.asp-delta{
  font-family:var(--display); font-weight:800; font-size:14px; text-align:right;
  font-variant-numeric:tabular-nums; color:var(--flat);
}
.asp-delta.up{color:var(--up)} .asp-delta.down{color:var(--down)}
.notebtn{width:28px;height:28px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--faint);cursor:pointer;display:grid;place-items:center;padding:0}
.notebtn:hover{background:var(--surface-3); color:var(--ink)}
.notebtn.has{color:var(--gold); background:var(--gold-soft)}
.notebtn svg{width:15px;height:15px}
.asp-note{grid-column:1/-1; padding:0 0 4px}
.asp-note textarea{min-height:52px; font-size:14px; background:var(--surface-2)}
@media (max-width:600px){
  .asp{grid-template-columns:minmax(0,1fr) 40px 30px; row-gap:6px}
  .scale{grid-column:1/-1}
  .sc{flex:1; width:auto}
}
.rows-sum{display:grid; gap:11px}
@media (min-width:760px){ .rows-sum{grid-template-columns:1fr 1fr} }
.escala{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:6px 12px; margin-top:12px; font-size:12.5px; color:var(--muted)}
.escala b{display:inline-grid; place-items:center; width:20px; height:20px; border-radius:6px; color:#fff; font-family:var(--display); font-size:12px; margin-right:6px; vertical-align:middle}

/* seguimiento */
.ses{display:grid; gap:10px}
.ses-row{
  border:1px solid var(--line); border-radius:11px; background:var(--surface-2); padding:12px 14px;
  display:grid; grid-template-columns:110px minmax(0,1fr) auto; gap:6px 14px; align-items:start;
}
.ses-row .f{display:flex; flex-direction:column; gap:2px}
.ses-row .fd{font-family:var(--display); font-weight:800; font-size:18px; line-height:1.1}
.ses-row .fs{font-size:12.5px; color:var(--muted)}
.ses-row .body{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:6px 14px}
.ses-row .k{font-family:var(--display); font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--faint)}
.ses-row .v{font-size:14px; overflow-wrap:anywhere}
.ses-row .acts{display:flex; gap:4px}
@media (max-width:640px){ .ses-row{grid-template-columns:1fr; } .ses-row .acts{justify-content:flex-end} }

/* nosotros */
.about-hero{
  border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow-lift); margin-bottom:14px;
  background:var(--navy); background-image:linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 60%, var(--navy-3) 100%); color:#fff;
  padding:28px 24px; display:flex; gap:22px; align-items:center; flex-wrap:wrap; position:relative;
}
.about-hero::after{content:''; position:absolute; right:-60px; bottom:-90px; width:260px; height:260px; border-radius:50%; border:2px solid rgba(255,255,255,.12); pointer-events:none}
.about-hero .logo{width:110px; height:132px; flex:none; filter:drop-shadow(0 6px 12px rgba(0,0,0,.45))}
.about-hero h1{font-size:40px; font-weight:800; text-transform:uppercase}
.about-hero h1 em{font-style:normal; color:var(--gold-2)}
.about-hero p{margin:6px 0 0; color:rgba(255,255,255,.82); max-width:60ch; font-size:15.5px}
.about-grid{display:grid; grid-template-columns:1fr; gap:14px}
@media (min-width:820px){ .about-grid{grid-template-columns:1.2fr .8fr} }
.prose{font-size:15.5px; line-height:1.65; max-width:68ch; white-space:pre-line}
.prose p{margin:0 0 12px}
.coach{display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap}
.coach .who{min-width:0; flex:1}
.coach h3{font-size:24px; font-weight:800; text-transform:uppercase}
.coach .role{font-family:var(--display); font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:700}
.values{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:14px}
.value{border:1px solid var(--line); border-radius:11px; padding:10px 12px; background:var(--surface-2)}
.value b{display:block; font-family:var(--display); font-size:16px; text-transform:uppercase; letter-spacing:.04em}
.value span{font-size:13px; color:var(--muted)}
.contact{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}

/* ajustes */
.settings{display:grid; gap:14px}
.settings .card h3{font-size:20px; text-transform:uppercase; margin-bottom:12px; display:flex; align-items:center; gap:10px}
.settings .card h3::before{content:''; width:6px; height:20px; border-radius:3px; background:var(--gold)}
.steps{margin:8px 0 0; padding-left:20px; font-size:14px; color:var(--muted)}
.steps li{margin-bottom:4px}
.steps code{background:var(--surface-3); padding:1px 6px; border-radius:5px; font-size:13px; color:var(--ink)}
.savebar{position:sticky; bottom:0; background:color-mix(in srgb, var(--ground) 88%, transparent); backdrop-filter:blur(8px); padding:12px 0; display:flex; gap:8px; justify-content:flex-end; border-top:1px solid var(--line); margin-top:8px}
.logo-prev{display:flex; align-items:center; gap:14px; padding:12px; border:1px dashed var(--line-strong); border-radius:11px; background:var(--surface-2); flex-wrap:wrap}
.logo-prev .logo{width:56px;height:68px}
.photo-row{display:flex; gap:14px; align-items:center; flex-wrap:wrap; padding:10px; border:1px dashed var(--line-strong); border-radius:11px; background:var(--surface-2)}

/* ---------- misc ---------- */
.empty{
  border:1.5px dashed var(--line-strong); border-radius:var(--r);
  padding:34px 18px; text-align:center; color:var(--muted); background:var(--surface-2);
}
.empty h3{font-size:22px; margin-bottom:5px; color:var(--ink); text-transform:uppercase}
.empty .ball{font-size:34px; line-height:1; margin-bottom:8px}
.note{
  display:flex; gap:9px; align-items:flex-start; padding:10px 13px; border-radius:11px;
  background:var(--gold-soft); border:1px solid var(--gold-line); font-size:13.5px; margin-bottom:14px; color:var(--ink);
}
.note.warn{background:color-mix(in srgb, var(--warn) 12%, var(--surface)); border-color:color-mix(in srgb, var(--warn) 45%, transparent)}
.actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.state{font-size:13.5px; color:var(--muted); flex-basis:100%}
.state.err{color:var(--down)}
dialog{
  border:1px solid var(--line); border-radius:16px; background:var(--surface); color:var(--ink);
  padding:0; max-width:540px; width:calc(100% - 32px); box-shadow:0 30px 70px -20px rgba(0,0,0,.5);
}
dialog::backdrop{background:rgba(6,12,30,.55); backdrop-filter:blur(2px)}
.dlg-h{padding:14px 18px; border-bottom:1px solid var(--line); font-family:var(--display); font-weight:800; font-size:22px; text-transform:uppercase; display:flex; align-items:center; gap:10px}
.dlg-h::before{content:''; width:6px; height:22px; border-radius:3px; background:var(--gold)}
.dlg-b{padding:16px 18px; display:grid; gap:12px; max-height:66vh; overflow:auto}
.dlg-f{padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap}
.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom,0px));
  z-index:60; background:var(--navy); color:#fff; padding:11px 18px; border-radius:11px;

<script>
/* ============================ modelo (tomado de la ficha Excel) ============================ */
const AREAS = [
  {id:'tec', nombre:'Técnica', items:[
    'Conducción con pie dominante','Conducción con pie no dominante','Control y recepción',
    'Pase corto','Pase largo','Perfil corporal y primer control','Regate / 1 contra 1',
    'Cambios de dirección con balón','Protección del balón','Finalización con pie dominante',
    'Finalización con pie no dominante','Remate de cabeza','Centros / golpeo específico']},
  {id:'tac', nombre:'Táctica / Juego', items:[
    'Orientación y toma de información','Toma de decisiones','Ocupación de espacios',
    'Desmarque y apoyo','1 contra 1 ofensivo','1 contra 1 defensivo','Transición ataque-defensa',
    'Transición defensa-ataque','Comprensión del modelo de juego']},
  {id:'fis', nombre:'Físico', items:[
    'Velocidad','Aceleración','Resistencia','Fuerza','Potencia','Agilidad',
    'Movilidad / flexibilidad','Capacidad de repetir esfuerzos']},
  {id:'coo', nombre:'Coordinativo', items:[
    'Coordinación general','Coordinación óculo-pédica','Equilibrio','Ritmo',
    'Orientación espacial','Reacción','Cambios de dirección','Disociación de movimientos']},
  {id:'men', nombre:'Mental / Conductual', items:[
    'Concentración','Confianza','Motivación','Perseverancia','Manejo del error',

const KEYS = {};
AREAS.forEach(a => KEYS[a.id] = a.items.map((n,i) => ({k:a.id+(i+1), nombre:n})));
const ALLKEYS = AREAS.flatMap(a => KEYS[a.id].map(x => ({...x, area:a.id, areaNombre:a.nombre})));
const ESCALA = [
  ['1','Inicial','necesita acompañamiento constante.'],
  ['2','En desarrollo','muestra avances, requiere apoyo frecuente.'],
  ['3','Adecuado','ejecuta con regularidad en situaciones conocidas.'],
  ['4','Bueno','ejecuta con seguridad y poca ayuda.'],
  ['5','Muy desarrollado','ejecuta con seguridad, rapidez y adaptación.'],
];
const RESUMEN = [
  ['inicio','Cómo inició el jugador'],
  ['avances','Avances más importantes'],
  ['fortalezas','Fortalezas actuales'],
  ['mejorar','Aspectos prioritarios por mejorar'],
  ['objetivo','Objetivo para el próximo periodo'],
  ['casa','Recomendación para casa'],
  ['comentario','Mensaje del entrenador para la familia'],
];
const SESION_CAMPOS = [
  ['objetivo','Objetivo trabajado'],['evidencia','Evidencia del avance'],
  ['dificultad','Dificultad encontrada'],['proximo','Próximo objetivo'],['observaciones','Observaciones'],
];
const POSICIONES = ['','Arquero','Defensa central','Lateral','Mediocampista','Volante','Extremo','Delantero'];
const PLANTEL_INICIAL = ['Mateo','Andrés','Yeicot','Emanuel','Ariana','Dante','Andrés A','Tiago','Martín','Juan D','Chacón','Katet','Adrián','Eidan'];

const CONFIG_DEF = {
  club:'MF Deportivo',
  lema:'Entrenamientos personalizados de fútbol',
  entrenador:'Marlon Andrés Forero',
  entrenadorRol:'Entrenador y fundador',
  entrenadorFoto:'',
  categoria:'',
  telefono:'', correo:'landresforero@gmail.com', instagram:'', ciudad:'',
  categorias:'Sub-6\nSub-8\nSub-10\nSub-12\nSub-14\nSub-16\nSub-18\nJuvenil',
  pais:'57',
  logo:'',
  resena:'MF Deportivo nace de una idea sencilla: cada niño aprende a su ritmo y merece un entrenamiento pensado para él. Trabajamos en grupos pequeños y sesiones individuales, con una planificación propia para cada jugador que cubre lo técnico, lo táctico, lo físico, lo coordinativo, lo mental y lo personal.\n\nEvaluamos con una ficha de 54 aspectos en escala de 1 a 5, comparamos cada periodo con el anterior y compartimos con las familias un informe claro de lo que mejoró y lo que sigue. Más que resultados, formamos jugadores disciplinados, seguros y felices con el balón.',
  resenaEntrenador:'Marlon Andrés Forero es el entrenador y fundador de MF Deportivo. Apasionado por el fútbol formativo, diseña cada sesión a partir de la evaluación individual del jugador y acompaña de cerca su proceso: técnica, toma de decisiones, condición física y, sobre todo, actitud y valores.\n\nSu método combina exigencia y cercanía: objetivos claros por periodo, seguimiento sesión a sesión y comunicación constante con las familias.',
  valores:'Disciplina|Constancia en cada entrenamiento.\nRespeto|Con compañeros, rivales y entrenador.\nConfianza|Jugadores seguros de sí mismos.\nAlegría|El fútbol se disfruta.',
  ejsService:'', ejsTemplate:'', ejsKey:'',
};

/* ============================ estado ============================ */
const S = {
  jugadores:[], evals:[], sesiones:[], config:{...CONFIG_DEF},
  route:{v:'inicio', id:null, ev:null, tab:'eval'}, filtro:'', listo:false, admin:false,
};
const uid = p => p + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoy = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES3 = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const fechaLarga = iso => { if(!iso) return '—'; const [y,m,d] = iso.split('-').map(Number); return d + ' de ' + MESES[(m||1)-1] + ' de ' + y; };
const fechaCorta = iso => { if(!iso) return '—'; const [y,m,d] = iso.split('-').map(Number); return d + ' ' + MES3[(m||1)-1] + ' ' + y; };
const periodoAuto = iso => { const [y,m] = (iso||hoy()).split('-').map(Number); const ini = m-2 < 0 ? 11 : m-2; return MES3[ini] + '–' + MES3[m-1] + ' ' + y; };
const iniciales = n => String(n||'?').trim().split(/\s+/).slice(0,2).map(p => p[0]).join('').toUpperCase();
const clubName = () => S.config.club || 'MF Deportivo';
const avatarHtml = (j, cls='') => `<span class="avatar ${cls}">${j.foto ? `<img src="${j.foto}" alt="">` : esc(iniciales(j.nombre))}</span>`;

/* ============================ logo ============================ */
function logoSvg(){
  return `<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Escudo ${esc(clubName())}">
  <defs>
    <linearGradient id="lgS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F3A80"/><stop offset="1" stop-color="#0B1A44"/></linearGradient>
    <linearGradient id="lgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6D67C"/><stop offset=".5" stop-color="#D9A93C"/><stop offset="1" stop-color="#B8852A"/></linearGradient>
  </defs>
  <path d="M100 6 L190 32 V128 C190 190 142 224 100 236 C58 224 10 190 10 128 V32 Z" fill="url(#lgG)"/>
  <path d="M100 16 L180 39 V128 C180 182 138 212 100 224 C62 212 20 182 20 128 V39 Z" fill="url(#lgS)"/>
  <path d="M100 16 L180 39 V60 L20 60 V39 Z" fill="#274A9C" opacity=".55"/>
  <circle cx="100" cy="56" r="26" fill="#FFFFFF"/>
  <path d="M100 42 L112 51 L107 66 L93 66 L88 51 Z" fill="#111827"/>
  <path d="M100 30 L106 42 L94 42 Z M124 46 L113 51 L112 40 Z M76 46 L87 51 L88 40 Z M118 76 L108 66 L120 60 Z M82 76 L92 66 L80 60 Z" fill="#111827"/>
  <text x="100" y="146" text-anchor="middle" font-family="'Barlow Condensed','Arial Narrow',Impact,sans-serif" font-weight="800" font-style="italic" font-size="84" fill="url(#lgG)" stroke="#FFFFFF" stroke-width="1.5" letter-spacing="-2">MF</text>
  <rect x="26" y="156" width="148" height="22" rx="4" fill="url(#lgG)"/>
  <text x="100" y="172" text-anchor="middle" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-weight="800" font-size="14.5" fill="#0B1A44" letter-spacing="1.2">ENTRENAMIENTOS</text>
  <text x="100" y="194" text-anchor="middle" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-weight="700" font-size="13" fill="#FFFFFF" letter-spacing="1">PERSONALIZADOS</text>
  <text x="100" y="211" text-anchor="middle" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-weight="700" font-size="12.5" fill="#F1C660" letter-spacing="1.4">DE FÚTBOL</text>
</svg>`;
}
function logoHtml(){ return S.config.logo ? `<img src="${S.config.logo}" alt="Logo ${esc(clubName())}">` : logoSvg(); }
let logoPngCache = {key:'', data:''};
async function logoPng(){
  const key = S.config.logo ? S.config.logo.slice(0,64) + S.config.logo.length : 'svg';
  if(logoPngCache.key === key && logoPngCache.data) return logoPngCache.data;
  const src = S.config.logo || ('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(logoSvg()));
  const data = await new Promise(res => {
    const img = new Image();
    img.onload = () => { try{
      const c = document.createElement('canvas'); const s = 360;
      const r = Math.min(s / img.naturalWidth, s / img.naturalHeight);
      c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/png'));
    }catch(e){ res(''); } };
    img.onerror = () => res(''); img.src = src;
  });
  logoPngCache = {key, data}; return data;
}
/* Redimensiona una imagen a un cuadrado pequeño para guardarla en el navegador */
function comprimirImagen(file, max = 320, png = false){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      try{
        const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.naturalWidth * r)); c.height = Math.max(1, Math.round(img.naturalHeight * r));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(png ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', .84));
      }catch(e){ rej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
/* Recorta al cuadrado (foto de perfil) */
function fotoPerfil(file, size = 320){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      try{
        const m = Math.min(img.naturalWidth, img.naturalHeight);
        const sx = (img.naturalWidth - m) / 2, sy = (img.naturalHeight - m) / 2;
        const c = document.createElement('canvas'); c.width = c.height = size;
        c.getContext('2d').drawImage(img, sx, sy, m, m, 0, 0, size, size);
        URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .85));
      }catch(e){ rej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

/* ============================ almacenamiento (en este dispositivo) ============================ */
const LS = 'mf_deportivo_v3';
function cargar(){
  try{
    const raw = localStorage.getItem(LS) || localStorage.getItem('mf_avances_v2') || localStorage.getItem('mf_avances_v1');
    if(raw){ const d = JSON.parse(raw);
      S.jugadores = d.jugadores || []; S.evals = d.evals || []; S.sesiones = d.sesiones || [];
      S.config = {...CONFIG_DEF, ...(d.config || {})}; }
  }catch(e){}
  if(!S.jugadores.length){
    S.jugadores = PLANTEL_INICIAL.map((n,i) => ({id:'j_' + n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,'_'), nombre:n, orden:i+1, creado:Date.now()}));
    guardar();
  }
  S.listo = true;
}
function guardar(){
  try{ localStorage.setItem(LS, JSON.stringify({v:3, jugadores:S.jugadores, evals:S.evals, sesiones:S.sesiones, config:S.config, guardado:Date.now()})); return true; }
  catch(e){ toast('No hay espacio para guardar en este navegador. Quita algunas fotos o exporta una copia de seguridad.', true); return false; }
}
function saveJugador(j){ S.jugadores = [...S.jugadores.filter(x => x.id !== j.id), j]; guardar(); refresh(); }
function delJugador(id){
  S.jugadores = S.jugadores.filter(x => x.id !== id);
  S.evals = S.evals.filter(e => e.jugadorId !== id); S.sesiones = S.sesiones.filter(s => s.jugadorId !== id);
  guardar();
}
function saveEval(ev){ S.evals = [...S.evals.filter(x => x.id !== ev.id), ev]; guardar(); }
function delEval(id){ S.evals = S.evals.filter(x => x.id !== id); guardar(); }
function saveSesion(s){ S.sesiones = [...S.sesiones.filter(x => x.id !== s.id), s]; guardar(); refresh(); }
function delSesion(id){ S.sesiones = S.sesiones.filter(x => x.id !== id); guardar(); refresh(); }
function saveConfig(c){ S.config = {...S.config, ...c}; logoPngCache = {key:'',data:''}; const ok = guardar(); pintarMarca(); refresh(); return ok; }

/* copia de seguridad */
function exportarRespaldo(){
  const data = JSON.stringify({app:'MF Deportivo', v:3, exportado:new Date().toISOString(), jugadores:S.jugadores, evals:S.evals, sesiones:S.sesiones, config:S.config}, null, 1);
  descargarBlob('Respaldo_' + clubName().replace(/\W+/g,'_') + '_' + hoy() + '.json', new Blob([data], {type:'application/json'}));
  toast('Copia de seguridad descargada 💾');
}
async function importarRespaldo(input){
  const f = input.files?.[0]; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    if(!d.jugadores) throw new Error('formato');
    const modo = await preguntar('Restaurar copia de seguridad', `El archivo tiene ${d.jugadores.length} jugadores, ${(d.evals||[]).length} avances y ${(d.sesiones||[]).length} sesiones.`,
      [['reemplazar','Reemplazar todo lo de este dispositivo'], ['combinar','Combinar con lo que ya hay']]);
    if(!modo) return;
    if(modo === 'reemplazar'){ S.jugadores = d.jugadores; S.evals = d.evals || []; S.sesiones = d.sesiones || []; S.config = {...CONFIG_DEF, ...(d.config || {})}; }
    else{
      const merge = (a, b) => { const m = new Map(a.map(x => [x.id, x])); b.forEach(x => m.set(x.id, x)); return [...m.values()]; };
      S.jugadores = merge(S.jugadores, d.jugadores); S.evals = merge(S.evals, d.evals || []); S.sesiones = merge(S.sesiones, d.sesiones || []);
      S.config = {...S.config, ...(d.config || {})};
    }
    guardar(); pintarMarca(); go('roster'); toast('Copia restaurada ✅');
  }catch(e){ toast('Ese archivo no es una copia de seguridad válida.', true); }
  input.value = '';
}

/* ============================ cálculos ============================ */
const evalsDe = id => S.evals.filter(e => e.jugadorId === id)
  .sort((a,b) => (a.fecha||'').localeCompare(b.fecha||'') || (a.creado||0) - (b.creado||0));
const sesionesDe = id => S.sesiones.filter(s => s.jugadorId === id)
  .sort((a,b) => (b.fecha||'').localeCompare(a.fecha||'') || (b.creado||0) - (a.creado||0));
const prom = vs => vs.length ? vs.reduce((a,b) => a+b, 0) / vs.length : null;
const promArea = (ev, areaId) => ev ? prom(KEYS[areaId].map(x => ev.scores?.[x.k]).filter(v => typeof v === 'number' && v > 0)) : null;
const promGeneral = ev => ev ? prom(ALLKEYS.map(x => ev.scores?.[x.k]).filter(v => typeof v === 'number' && v > 0)) : null;
const evaluados = ev => ALLKEYS.filter(x => ev?.scores?.[x.k] > 0).length;
const n1 = v => v == null ? '—' : v.toFixed(1);
const signo = d => d == null ? '' : (d > 0 ? '+' : '') + d.toFixed(1);
const cls = d => d == null ? '' : d > 0.05 ? 'up' : d < -0.05 ? 'down' : '';
function evalPrevia(jid, ev){ const l = evalsDe(jid); const i = l.findIndex(x => x.id === ev.id); return i > 0 ? l[i-1] : null; }
function resumenJugador(j){
  const l = evalsDe(j.id); const ult = l[l.length-1], ant = l[l.length-2];
  const p = promGeneral(ult), pa = promGeneral(ant);
  return {ult, ant, p, d:(p != null && pa != null) ? p - pa : null, ses:sesionesDe(j.id)};
}
const listaCategorias = extra => { const l = String(S.config.categorias || '').split('\n').map(x => x.trim()).filter(Boolean); if(extra && !l.includes(extra)) l.push(extra); return ['', ...l]; };
function telWa(j){
  const raw = String(j.telefono || '').replace(/\D/g, ''); if(!raw) return '';
  const pais = String(S.config.pais || '57').replace(/\D/g,'');
  if(raw.length <= 10 && pais && !raw.startsWith(pais)) return pais + raw;
  return raw;
}

// SHA-256 compacto (sin dependencias). Solo se guarda el hash de las credenciales, nunca la contraseña.
function sha256(str){
  const K = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
  const bytes = new TextEncoder().encode(str); const l = bytes.length; const N = ((l + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(N); m.set(bytes); m[l] = 0x80; const dv = new DataView(m.buffer); dv.setUint32(N - 4, l * 8 >>> 0); dv.setUint32(N - 8, Math.floor(l * 8 / 2**32));
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]; const w = new Uint32Array(64);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for(let i = 0; i < N; i += 64){
    for(let t = 0; t < 16; t++) w[t] = dv.getUint32(i + t*4);
    for(let t = 16; t < 64; t++){ const s0 = rotr(w[t-15],7) ^ rotr(w[t-15],18) ^ (w[t-15] >>> 3), s1 = rotr(w[t-2],17) ^ rotr(w[t-2],19) ^ (w[t-2] >>> 10); w[t] = (w[t-16] + s0 + w[t-7] + s1) >>> 0; }
    let [a,b,c,d,e,f,g,h] = H;
    for(let t = 0; t < 64; t++){
      const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25), ch = (e & f) ^ (~e & g), t1 = (h + S1 + ch + K[t] + w[t]) >>> 0;
      const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22), mj = (a & b) ^ (a & c) ^ (b & c), t2 = (S0 + mj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H = H.map((x, k) => (x + [a,b,c,d,e,f,g,h][k]) >>> 0);
  }
  return H.map(x => x.toString(16).padStart(8,'0')).join('');
}
const ACCESO_HASH = 'c132976f8b4f932b19f1935ea9edfe0ec5fc558dc2507d9c113906c66d7f3cfd';
const SESION = 'mf_sesion';
function sesionActiva(){
  try{
    if(sessionStorage.getItem(SESION) === '1') return true;
    const h = Number(localStorage.getItem(SESION) || 0); if(h && h > Date.now()) return true;
    if(h) localStorage.removeItem(SESION);
  }catch(e){}
  return false;
}
function iniciarSesion(usuario, clave, recordar){
  const ok = sha256('mf-deportivo|' + String(usuario || '').trim().toUpperCase() + '|' + String(clave || '')) === ACCESO_HASH;
  if(!ok) return false;
  try{ if(recordar) localStorage.setItem(SESION, String(Date.now() + 30*24*3600*1000)); else sessionStorage.setItem(SESION, '1'); }catch(e){}
  S.admin = true; return true;
}
function cerrarSesion(){
  try{ localStorage.removeItem(SESION); sessionStorage.removeItem(SESION); }catch(e){}
  S.admin = false; go('inicio'); toast('Sesión cerrada.');
}

/* ============================ router / render ============================ */
const app = document.getElementById('app');
let pendienteRender = false;
const editando = () => {
  const a = document.activeElement;
  return a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && !['button','checkbox','file'].includes(a.type)) || a.tagName === 'SELECT') && app.contains(a);
};
function refresh(){ if(editando()){ pendienteRender = true; return; } render(); }
document.addEventListener('focusout', () => setTimeout(() => { if(pendienteRender && !editando()){ pendienteRender = false; render(); } }, 80));
function go(v, id, ev, tab){
  if(S.route.v === 'ajustes' && v !== 'ajustes' && ajustesSucio && !confirm('Tienes cambios sin guardar en Ajustes. ¿Salir sin guardar?')) return;
  ajustesSucio = false;
  if(ADMIN_VIEWS.includes(v) && !S.admin) v = 'login';
  S.route = {v, id:id||null, ev:ev||null, tab:tab || S.route.tab || 'eval'}; window.scrollTo({top:0}); render();
}
function pintarMarca(){
  document.getElementById('brandName').textContent = clubName();
  document.getElementById('brandSub').textContent = S.config.lema || 'Entrenamientos personalizados';
  document.getElementById('brandLogo').innerHTML = logoHtml();
  document.title = clubName();
}
function render(){
  document.getElementById('navAdmin').hidden = !S.admin;
  document.getElementById('navLogin').hidden = S.admin;
  ['Plantel','Nosotros','Ajustes'].forEach(n => document.getElementById('nav'+n).setAttribute('aria-current', S.route.v === n.toLowerCase() || (n === 'Plantel' && S.route.v === 'jugador') || (n === 'Nosotros' && S.route.v === 'inicio') ? 'page' : 'false'));
  if(!S.listo){ app.innerHTML = '<div class="empty"><div class="ball">⚽</div><h3>Cargando…</h3></div>'; return; }
  const v = S.route.v;
  app.innerHTML = v === 'jugador' ? vistaJugador() : (v === 'nosotros' || v === 'inicio') ? vistaNosotros() : v === 'ajustes' ? vistaAjustes() : v === 'login' ? vistaLogin() : vistaRoster();
  const u = document.getElementById('lgUser'); if(u) u.focus();
  document.querySelectorAll('.agroup').forEach(d => {
    d.addEventListener('toggle', () => { try{ localStorage.setItem('mf_open_'+d.dataset.area, d.open?'1':'0'); }catch(e){} });
  });
  const s = document.getElementById('buscar'); if(s && S.filtro){ s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}

/* ---------- vista: plantel ---------- */
function vistaRoster(){
  const todos = S.jugadores.slice().sort((a,b) => (a.orden??99) - (b.orden??99) || (a.nombre||'').localeCompare(b.nombre||''));
  const f = S.filtro.trim().toLowerCase();
  const filas = f ? todos.filter(j => (j.nombre||'').toLowerCase().includes(f) || (j.categoria||'').toLowerCase().includes(f) || (j.posicion||'').toLowerCase().includes(f)) : todos;

  const res = todos.map(j => ({j, ...resumenJugador(j)}));
  const conProm = res.filter(r => r.p != null);
  const promEquipo = prom(conProm.map(r => r.p));
  const mes = hoy().slice(0,7);
  const sesMes = S.sesiones.filter(s => (s.fecha||'').startsWith(mes)).reduce((a,s) => a + (Number(s.sesiones)||1), 0);
  const mejor = res.filter(r => r.d != null).sort((a,b) => b.d - a.d)[0];
  const evalMes = S.evals.filter(e => (e.fecha||'').startsWith(mes)).length;

  const hero = `
  <section class="hero">
    <div class="hero-in">
      <div class="logo">${logoHtml()}</div>
      <div>
        <h1>${esc(clubName())} <em>· Avances</em></h1>
        <div class="lema">${esc(S.config.lema || 'Entrenamientos personalizados de fútbol')}${S.config.entrenador ? ' · ' + esc(S.config.entrenador) : ''}</div>
      </div>
      <div class="cta">
        <button class="btn ghost" onclick="exportarCsv()" title="Exportar todo a Excel (CSV)">${ICONS.csv} CSV</button>
        <button class="btn primary" onclick="nuevoJugador()">${ICONS.plus} Nuevo jugador</button>
      </div>
    </div>
    <div class="tiles">
      <div class="tile"><div class="k">Jugadores</div><div class="v">${todos.length}</div><div class="sub">${conProm.length} con avances registrados</div></div>
      <div class="tile"><div class="k">Promedio del equipo</div><div class="v gold">${n1(promEquipo)}<small>/ 5</small></div><div class="sub">último periodo de cada jugador</div></div>
      <div class="tile"><div class="k">Sesiones este mes</div><div class="v">${sesMes}</div><div class="sub">${evalMes} evaluaciones en ${MESES[Number(mes.slice(5))-1]}</div></div>
      <div class="tile"><div class="k">Mayor avance</div><div class="v ${mejor ? 'gold' : ''}">${mejor ? signo(mejor.d) : '—'}</div><div class="sub">${mejor ? esc(mejor.j.nombre) + ' · ' + esc(mejor.ult.periodo || '') : 'Se calcula desde el 2.º avance'}</div></div>
    </div>
  </section>`;

  if(!todos.length) return hero + `
    <div class="empty"><div class="ball">⚽</div><h3>Empieza por el plantel</h3><p>Agrega a cada niño y luego registra su primer avance.</p>
    <p><button class="btn primary" onclick="nuevoJugador()">${ICONS.plus} Agregar jugador</button></p></div>`;

  const cards = filas.map(j => {
    const r = resumenJugador(j);
    const wa = telWa(j);
    return `<button class="pcard-r" onclick="go('jugador','${j.id}')">
      ${avatarHtml(j)}
      <span style="min-width:0">
        <span class="nm">${esc(j.nombre)}</span>
        <span class="meta">${esc([j.categoria, j.posicion, j.edad ? j.edad + ' años' : ''].filter(Boolean).join(' · ') || 'Completa sus datos')}</span>
      </span>
      <span class="score">
        <span class="score-num ${r.p == null ? 'none' : ''}">${r.p == null ? 'Sin avances' : n1(r.p)}</span>
        <span class="bar"><i style="width:${r.p ? (r.p/5*100).toFixed(0) : 0}%"></i></span>
        ${r.d != null ? `<span class="chip ${cls(r.d)}">${signo(r.d)}</span>` : r.ult ? `<span class="chip">${esc(r.ult.periodo || fechaCorta(r.ult.fecha))}</span>` : ''}

      <span class="quick">
        ${wa ? `<a class="iconbtn wa" href="https://wa.me/${wa}" target="_blank" rel="noopener" title="WhatsApp del acudiente" onclick="event.stopPropagation()">${ICONS.wa}</a>` : ''}

      </span>
    </button>`;
  }).join('');

  return hero + `
    <div class="page-head">
      <h2>Plantel</h2><span class="sub">${filas.length} de ${todos.length}</span>
      <input class="search" id="buscar" type="search" placeholder="Buscar jugador…" value="${esc(S.filtro)}" oninput="S.filtro=this.value;render()">
    </div>
    <div class="cards">${cards || '<div class="empty" style="grid-column:1/-1">Ningún jugador coincide con la búsqueda.</div>'}</div>
    <p class="legend">Toca un jugador para ver su ficha, calificar un avance, registrar sesiones o enviar el informe a la familia. Los datos se guardan en este dispositivo; haz una <a href="#" onclick="event.preventDefault();go('ajustes')">copia de seguridad</a> cada tanto.</p>`;
}

  const l = evalsDe(j.id);
  const ses = sesionesDe(j.id);
  const ev = l.find(x => x.id === S.route.ev) || l[l.length-1] || null;
  const wa = telWa(j);

  const head = `
  <div class="phead">
    <button class="btn ghost sm" onclick="go('roster')" title="Volver al plantel">${ICONS.back} Plantel</button>
    <span style="position:relative;cursor:pointer" onclick="editarJugador('${j.id}')" title="Cambiar foto">${avatarHtml(j,'lg')}</span>
    <div style="min-width:0">
      <h2>${esc(j.nombre)}</h2>
      <div class="meta">
        ${[j.categoria, j.posicion, j.edad ? j.edad + ' años' : '', j.pie ? 'Pie ' + j.pie.toLowerCase() : '', j.tiempo ? 'Entrena hace ' + j.tiempo : ''].filter(Boolean).map(esc).join('<span style="opacity:.5">·</span>') || 'Completa sus datos con “Editar”'}
      </div>
    </div>
    <div class="right">
      ${wa ? `<a class="btn ghost sm" href="https://wa.me/${wa}" target="_blank" rel="noopener">${ICONS.wa} ${esc(j.acudiente || 'Acudiente')}</a>` : ''}
      <button class="btn ghost sm" onclick="editarJugador('${j.id}')">${ICONS.edit} Editar</button>
    </div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="${S.route.tab !== 'seg'}" onclick="go('jugador','${j.id}','${ev ? ev.id : ''}','eval')">Evaluación<span class="cnt">${l.length}</span></button>
    <button class="tab" role="tab" aria-selected="${S.route.tab === 'seg'}" onclick="go('jugador','${j.id}','${ev ? ev.id : ''}','seg')">Seguimiento de sesiones<span class="cnt">${ses.length}</span></button>
  </div>`;

  if(S.route.tab === 'seg') return head + vistaSeguimiento(j, ses);

  const tabs = l.map(e => `<button type="button" class="ptab" aria-selected="${ev && e.id === ev.id}" onclick="go('jugador','${j.id}','${e.id}')">
      ${esc(e.periodo || fechaCorta(e.fecha))}<small>${n1(promGeneral(e))} / 5 · ${evaluados(e)}/${ALLKEYS.length}</small></button>`).join('');
  const cabPeriodos = `
  <div class="card">
    <div class="sect-title">Periodos evaluados</div>
    <div class="periods">
      ${tabs || '<span style="color:var(--muted);font-size:14px">Todavía no hay avances registrados.</span>'}
      <button type="button" class="btn primary" onclick="nuevoAvance('${j.id}')" style="margin-left:auto">${ICONS.plus} Nuevo avance</button>
    </div>
  </div>`;

  if(!ev) return head + cabPeriodos + `<div class="empty"><div class="ball">📋</div><h3>Sin avances todavía</h3>
    <p>El primer avance queda como <b>diagnóstico inicial</b>. A partir del segundo, la página calcula sola el avance de cada aspecto contra el periodo anterior.</p></div>`;

  const prev = evalPrevia(j.id, ev);
  const pg = promGeneral(ev), pgPrev = promGeneral(prev);
  const dg = (pg != null && pgPrev != null) ? pg - pgPrev : null;

  const areasHtml = AREAS.map(a => {
    const p = promArea(ev, a.id), pp = promArea(prev, a.id);
    const d = (p != null && pp != null) ? p - pp : null;
    return `<div class="areabox" data-abox="${a.id}">
      <div class="an">${esc(a.nombre)}</div>
      <div class="av"><b>${n1(p)}</b><span>/ 5</span>${d != null ? `<span class="chip ${cls(d)}" style="margin-left:auto">${signo(d)}</span>` : ''}</div>
      <div class="bar"><i style="width:${p ? (p/5*100).toFixed(0) : 0}%"></i></div>
    </div>`;
  }).join('');

  const grupos = AREAS.map(a => {
    let abierto = a.id === 'tec';
    try{ const v = localStorage.getItem('mf_open_'+a.id); if(v !== null) abierto = v === '1'; }catch(e){}
    const filas = KEYS[a.id].map(x => {
      const v = ev.scores?.[x.k] || 0, pv = prev?.scores?.[x.k] || 0;
      const d = (v && pv) ? v - pv : null;
      const nota = ev.notas?.[x.k] || '';
      const btns = [1,2,3,4,5].map(n => `<button type="button" class="sc" data-k="${x.k}" data-v="${n}" aria-pressed="${v === n}" aria-label="${esc(x.nombre)}: ${n}">${n}</button>`).join('')
        + `<button type="button" class="sc clear" data-k="${x.k}" data-v="0" aria-label="Sin evaluar" title="Quitar calificación">–</button>`;
      return `<div class="asp" data-row="${x.k}">
        <span class="asp-name">${esc(x.nombre)}${pv ? `<span style="color:var(--faint);font-size:12px"> · antes ${pv}</span>` : ''}</span>
        <span class="scale">${btns}</span>
        <span class="asp-delta ${d == null ? '' : d > 0 ? 'up' : d < 0 ? 'down' : ''}" data-delta="${x.k}">${d == null ? '' : (d > 0 ? '+' : '') + d}</span>
        <button type="button" class="notebtn ${nota ? 'has' : ''}" data-note="${x.k}" title="Observación: qué mejoró / qué debe mejorar">${ICONS.note}</button>
        <div class="asp-note" data-notebox="${x.k}" ${nota ? '' : 'hidden'}><textarea data-nota="${x.k}" placeholder="Qué mejoró, qué debe mejorar, observaciones…">${esc(nota)}</textarea></div>
      </div>`;
    }).join('');
    const p = promArea(ev, a.id);
    const hechos = KEYS[a.id].filter(x => ev.scores?.[x.k]).length;
    return `<details class="agroup" data-area="${a.id}" ${abierto ? 'open' : ''}>
      <summary><span class="arrow">▶</span>${esc(a.nombre)} <span class="done" data-done="${a.id}">${hechos}/${KEYS[a.id].length}</span><span class="gv" data-gv="${a.id}">${n1(p)}</span></summary>${filas}</details>`;
  }).join('');

  const resumen = RESUMEN.map(([k,label]) => `<label class="f"><span>${label}</span>
    <textarea data-res="${k}" placeholder="…">${esc(ev.resumen?.[k] || '')}</textarea></label>`).join('');
  const porArea = AREAS.map(a => `<label class="f"><span>${esc(a.nombre)}</span>
    <textarea data-res="ar_${a.id}" placeholder="Avances observados en ${esc(a.nombre.toLowerCase())}…" style="min-height:52px">${esc(ev.resumen?.['ar_'+a.id] || '')}</textarea></label>`).join('');
  const correoListo = !!(S.config.ejsService && S.config.ejsTemplate && S.config.ejsKey);

  return head + cabPeriodos + `
  <div class="card" id="evalCard" data-ev="${ev.id}">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px">
      <div style="min-width:0">
        <div class="sect-title" style="margin-bottom:2px">Avance ${esc(ev.periodo || '')}</div>
        <div style="font-size:13.5px;color:var(--muted)">${fechaLarga(ev.fecha)} · ${esc(ev.entrenador || S.config.entrenador || 'Sin entrenador')}${prev ? ' · comparado con <b>' + esc(prev.periodo || fechaCorta(prev.fecha)) + '</b>' : ' · <b>diagnóstico inicial</b>'}${ev.enviado ? ' · enviado el ' + fechaCorta(ev.enviado.fecha) : ''}</div>
      </div>
      <div style="margin-left:auto;display:flex;align-items:baseline;gap:8px">
        <span class="bignum" id="pgVal">${n1(pg)}</span>
        <span style="color:var(--faint);font-size:13px">/ 5</span>
        ${dg != null ? `<span class="chip ${cls(dg)}" style="font-size:14px">${signo(dg)}</span>` : ''}
      </div>
      <div style="display:flex;gap:6px">
        <button type="button" class="btn sm" onclick="editarAvance('${ev.id}')">${ICONS.edit} Periodo</button>
        <button type="button" class="btn sm danger" onclick="borrarAvance('${ev.id}')">${ICONS.trash}</button>
      </div>
    </div>
    <div class="areas">${areasHtml}</div>
  </div>

  <div class="card">
    <div class="sect-title">Evaluación por aspecto · escala 1 a 5</div>
    ${grupos}
    <div class="escala">${ESCALA.map(([n,t,d]) => `<div><b style="background:var(--s${n})">${n}</b><strong>${t}:</strong> ${d}</div>`).join('')}</div>
  </div>

  <div class="card">
    <div class="sect-title">Resumen del proceso</div>
    <div class="rows-sum">${resumen}</div>
    <div class="sect-title" style="margin-top:18px">Avances observados por área · para el informe a la familia</div>
    <div class="rows-sum">${porArea}</div>
  </div>

  <div class="card">
    <div class="sect-title">Informe para la familia</div>
    <div class="actions">
      <button type="button" class="btn navy" onclick="descargarPdf()">${ICONS.pdf} Descargar PDF</button>
      <button type="button" class="btn primary" onclick="enviarCorreo()">${ICONS.mail} Enviar por correo</button>
      <button type="button" class="btn wa" onclick="enviarWhatsApp()">${ICONS.wa} Enviar por WhatsApp</button>
      <span id="mailState" class="state"></span>
    </div>
    <p class="legend">Destinatarios: ${j.email ? '<b>' + esc(j.email) + '</b>' : '<i>sin correo</i>'} · ${wa ? '<b>+' + wa + '</b>' : '<i>sin WhatsApp</i>'}${j.acudiente ? ' (' + esc(j.acudiente) + ')' : ''}.
    ${correoListo ? 'El correo sale directo desde tu cuenta con el PDF adjunto.' : 'Sin correo configurado: el botón descarga el PDF y abre tu app de correo con el mensaje listo. Configúralo en <a href="#" onclick="event.preventDefault();go(\'ajustes\')">Ajustes → Correo</a> para que salga con el PDF adjunto automáticamente.'}</p>
  </div>`;
}

function entrar(form){
  const d = Object.fromEntries(new FormData(form).entries());
  if(iniciarSesion(d.usuario, d.clave, !!d.recordar)){ toast('Bienvenido, ' + (S.config.entrenador || 'entrenador') + ' ⚽'); go('roster'); }
  else{ const e = document.getElementById('lgErr'); if(e){ e.hidden = false; } form.querySelector('[name=clave]').value = ''; form.querySelector('[name=clave]').focus(); }
}

function actualizarDerivados(ev){
  const prev = evalPrevia(ev.jugadorId, ev);
  AREAS.forEach(a => {
    const p = promArea(ev, a.id), pp = promArea(prev, a.id);
    const gv = document.querySelector(`[data-gv="${a.id}"]`); if(gv) gv.textContent = n1(p);
    const dn = document.querySelector(`[data-done="${a.id}"]`); if(dn) dn.textContent = KEYS[a.id].filter(x => ev.scores?.[x.k]).length + '/' + KEYS[a.id].length;
    const box = document.querySelector(`[data-abox="${a.id}"]`);
    if(box){
      box.querySelector('.av b').textContent = n1(p);
      box.querySelector('.bar i').style.width = (p ? (p/5*100).toFixed(0) : 0) + '%';
      const d = (p != null && pp != null) ? p - pp : null;
      let chip = box.querySelector('.chip');
      if(d == null){ if(chip) chip.remove(); }
      else{
        if(!chip){ chip = document.createElement('span'); chip.className = 'chip'; chip.style.marginLeft = 'auto'; box.querySelector('.av').appendChild(chip); }
        chip.textContent = signo(d); chip.className = 'chip ' + cls(d);
      }
    }
  });
  ALLKEYS.forEach(x => {
    const el = document.querySelector(`[data-delta="${x.k}"]`); if(!el) return;
    const v = ev.scores?.[x.k] || 0, pv = prev?.scores?.[x.k] || 0;
    const d = (v && pv) ? v - pv : null;
    el.textContent = d == null ? '' : (d > 0 ? '+' : '') + d;
    el.className = 'asp-delta ' + (d == null ? '' : d > 0 ? 'up' : d < 0 ? 'down' : '');
  });
  const pgEl = document.getElementById('pgVal'); if(pgEl) pgEl.textContent = n1(promGeneral(ev));
}

const pdfTxt = s => String(s ?? '').replace(/–/g,'-').replace(/—/g,'-').replace(/[“”]/g,'"').replace(/’/g,"'").replace(/…/g,'...');
async function construirPdf(j, ev){
  const JS = window.jspdf && window.jspdf.jsPDF;
  if(!JS) throw new Error('nolib');
  const prev = evalPrevia(j.id, ev);
  const doc = new JS({unit:'pt', format:'a4'});
  const W = 595, H = 842, M = 46; let y = 0;
  const navy = [15,31,75], navy2 = [26,50,114], gold = [217,169,60], gris = [86,97,138], tinta = [15,26,56], linea = [223,227,239], suave = [247,248,252];
  const verde = [34,148,90], rojo = [211,80,59], flat = [138,147,179];
  const colD = d => d == null ? gris : d > 0.05 ? verde : d < -0.05 ? rojo : flat;
  const logo = await logoPng();
  const club = pdfTxt(clubName());

  const cabecera = () => {
    doc.setFillColor(...navy); doc.rect(0, 0, W, 26, 'F');
    doc.setFillColor(...gold); doc.rect(0, 26, W, 2, 'F');
    doc.setFont('helvetica','bold').setFontSize(8).setTextColor(255,255,255);
    doc.text(club.toUpperCase() + '   ·   INFORME DE AVANCE   ·   ' + pdfTxt(j.nombre), M, 17);
    y = 48;
  };
  const salto = need => { if(y + need > H - 50){ doc.addPage(); cabecera(); } };
  const titulo = t => { salto(30); doc.setFont('helvetica','bold').setFontSize(9).setTextColor(...navy2); doc.text(pdfTxt(t).toUpperCase(), M, y);
    doc.setDrawColor(...gold).setLineWidth(1.2).line(M, y + 4, M + 28, y + 4); doc.setDrawColor(...linea).setLineWidth(.6).line(M + 28, y + 4, W - M, y + 4); y += 18; };
  const parrafo = (label, texto, ancho = W - M*2) => {
    const t = pdfTxt(texto).trim(); if(!t) return;
    const lines = doc.setFont('helvetica','normal').setFontSize(9.5).splitTextToSize(t, ancho);
    salto(16 + lines.length * 12);
    doc.setFont('helvetica','bold').setFontSize(8).setTextColor(...gold).text(pdfTxt(label).toUpperCase(), M, y); y += 11;
    doc.setFont('helvetica','normal').setFontSize(9.5).setTextColor(...tinta).text(lines, M, y); y += lines.length * 12 + 8;
  };

  // portada
  doc.setFillColor(...navy); doc.rect(0, 0, W, 132, 'F');
  doc.setFillColor(...navy2); doc.triangle(W, 0, W, 132, W - 220, 132, 'F');
  doc.setFillColor(...gold); doc.rect(0, 132, W, 3, 'F');
  if(logo) doc.addImage(logo, 'PNG', M, 24, 70, 84);
  const tx = M + (logo ? 86 : 0);
  doc.setTextColor(241,198,96).setFont('helvetica','bold').setFontSize(10); doc.text(club.toUpperCase(), tx, 46);
  doc.setTextColor(255,255,255).setFontSize(26); doc.text('Informe de avance', tx, 74);
  doc.setFont('helvetica','normal').setFontSize(12); doc.text(pdfTxt(j.nombre) + '   ·   ' + pdfTxt(ev.periodo || fechaLarga(ev.fecha)), tx, 94);
  doc.setFontSize(9).setTextColor(200,208,235); doc.text(pdfTxt(S.config.lema || 'Entrenamientos personalizados de fútbol'), tx, 112);
  if(j.foto){ try{ doc.setFillColor(...gold); doc.roundedRect(W - M - 74, 22, 74, 74, 8, 8, 'F'); doc.addImage(j.foto, 'JPEG', W - M - 71, 25, 68, 68); }catch(e){} }
  y = 158;

  // datos del jugador
  titulo('Datos del jugador');
  const datos = [['Edad', j.edad ? j.edad + ' años' : '-'], ['Posición', j.posicion || '-'],
    ['Pie dominante', j.pie || '-'], ['Categoría', j.categoria || '-'],
    ['Tiempo entrenando', j.tiempo || '-'], ['Entrenador', ev.entrenador || S.config.entrenador || '-'],

/* Envío con EmailJS (REST, sin librería). Devuelve texto de error o '' si salió bien. */
async function enviarEmailJS(params){
  const c = S.config;
  const r = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({service_id:c.ejsService, template_id:c.ejsTemplate, user_id:c.ejsKey, template_params:params}),
  });
  if(r.ok) return '';
  const txt = await r.text().catch(() => '');
  if(r.status === 400 && /attachment|size|large/i.test(txt)) return 'El PDF es demasiado grande para el plan gratuito de EmailJS. Quita la foto del jugador o envíalo por WhatsApp.';
  if(r.status === 400 || r.status === 403) return 'EmailJS rechazó el envío: ' + (txt || 'revisa el Service ID, Template ID y Public Key en Ajustes.');
  if(r.status === 429) return 'Se alcanzó el límite de correos del mes en EmailJS.';
  return 'No se pudo enviar (' + r.status + '). ' + txt;
}

/* ============================ exportar CSV ============================ */
function exportarCsv(){
  const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const cab = ['Jugador','Edad','Posicion','Pie','Categoria','Acudiente','Telefono','Correo','Periodo','Fecha','Entrenador','Area','Aspecto','Anterior','Actual','Avance','Observacion'];
  const lineas = [cab.map(q).join(',')];
  S.jugadores.forEach(j => evalsDe(j.id).forEach(ev => {
    const prev = evalPrevia(j.id, ev);
    ALLKEYS.forEach(x => {
      const v = ev.scores?.[x.k]; if(!v) return;
      const pv = prev?.scores?.[x.k] || '';
      lineas.push([j.nombre, j.edad, j.posicion, j.pie, j.categoria, j.acudiente, j.telefono, j.email, ev.periodo, ev.fecha,
        ev.entrenador, x.areaNombre, x.nombre, pv, v, pv ? v - pv : '', ev.notas?.[x.k] || ''].map(q).join(','));
    });
  }));
  const cab2 = ['Jugador','Fecha','Sesiones','Objetivo trabajado','Evidencia del avance','Dificultad encontrada','Proximo objetivo','Observaciones'];
  const l2 = [cab2.map(q).join(',')];
  S.jugadores.forEach(j => sesionesDe(j.id).forEach(s => l2.push([j.nombre, s.fecha, s.sesiones, s.objetivo, s.evidencia, s.dificultad, s.proximo, s.observaciones].map(q).join(','))));
  if(lineas.length === 1 && l2.length === 1) return toast('Todavía no hay evaluaciones ni sesiones para exportar.', true);
  const csv = '﻿' + lineas.join('\r\n') + '\r\n\r\n' + l2.join('\r\n');
  if(descargarBlob('Avances_' + clubName().replace(/\W+/g,'_') + '_' + hoy() + '.csv', new Blob([csv], {type:'text/csv;charset=utf-8'}))) toast('CSV guardado. Ábrelo con Excel.');
}

/* ============================ toast ============================ */
let toastT = null;
function toast(msg, err){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast' + (err ? ' err' : ''); el.textContent = msg; el.setAttribute('role','status');
  document.body.appendChild(el);
  clearTimeout(toastT); toastT = setTimeout(() => el.remove(), err ? 6500 : 3200);
}
